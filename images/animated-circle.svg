<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100">
  <circle cx="50" cy="50" r="40" fill="none" stroke-width="8" stroke="#FF5733">
    <animateTransform attributeName="transform" type="rotate"
      from="0 50 50" to="360 50 50" dur="2s" repeatCount="indefinite" />
    <animate attributeName="stroke" values="#FF5733;#33FF57;#3357FF;#FF5733" dur="4s" repeatCount="indefinite" />
  </circle>
</svg>
